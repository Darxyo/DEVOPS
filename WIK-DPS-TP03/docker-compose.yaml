services:
  ping-api:
    build:
      context: .
      dockerfile: dockerfile.multi
    environment:
      - PING_LISTEN_PORT=3000
    expose:
      - "3000"
    deploy:
      replicas: 4

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ping-api