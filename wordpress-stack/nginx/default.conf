# Upstream : les deux répliques WordPress (PHP-FPM)
upstream wordpress_backend {
    server wordpress_1:9000;
    server wordpress_2:9000;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Taille max des uploads
    client_max_body_size 64M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Fichiers statiques servis directement par nginx
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tout le reste passe en PHP-FPM (load balancé entre wp_1 et wp_2)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass   wordpress_backend;   # load balancing round-robin
        fastcgi_index  index.php;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;

        fastcgi_read_timeout 300;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(ht|git|env) {
        deny all;
    }
}